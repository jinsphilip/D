# Web service only — the database is Supabase (Postgres), not Render's own.
# DATABASE_URL isn't set here since it's a secret: Render will prompt for it
# during the Blueprint deploy (paste your Supabase connection string, see
# DEPLOY.md), and you can update it any time under the service's
# Environment settings without touching this file.
services:
  - type: web
    name: nep-payroll-app
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
