# Web service only — the database is MongoDB Atlas, not Render's own.
# MONGODB_URI, ADMIN_USERNAME, and ADMIN_PASSWORD are secrets: Render will
# prompt for them during the Blueprint deploy (see DEPLOY.md for what to
# put in each), and you can update any of them later under the service's
# Environment settings without touching this file. SESSION_SECRET doesn't
# need a value from you at all — Render generates a random one automatically.
#
# Build/start commands explicitly `cd server` themselves rather than relying
# on `rootDir` — on at least one account, Render ran these from the repo
# root regardless of rootDir, which broke `npm start` (it looked for
# package.json at the repo root instead of server/package.json). Explicit
# `cd` works no matter which directory Render actually starts them in.
services:
  - type: web
    name: nep-payroll-app
    runtime: node
    plan: free
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
