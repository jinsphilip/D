databases:
  - name: nep-payroll-db
    plan: free
    databaseName: nep_payroll
    user: nep_app

services:
  - type: web
    name: nep-payroll-app
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nep-payroll-db
          property: connectionString
